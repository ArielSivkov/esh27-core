<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>ESH27 · מפת החוות הטופוגרפית ומרכז השליטה</title>
  <meta name="description" content="מפה טופוגרפית בהירה ברמת Apple Maps של 130+ חוות ביו״ש והבקעה, בסיס האם בעין חרשה, 100 פריטי OSINT ו-100 אנשי קשר – ESH27 Build & Facility." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://farms.esh27.com/" />
  <meta property="og:title" content="ESH27 · מפת החוות הטופוגרפית (130+ חוות ביו״ש והבקעה)" />
  <meta property="og:description" content="מפה טופוגרפית אינטראקטיבית בהירה, מצגת 5 שלבים לשון, 100 פריטי OSINT ו-100 אנשי קשר ולידים." />
  <meta name="theme-color" content="#F5F5F7" />
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <style>
    :root {
      --bg-app: #F5F5F7;
      --bg-glass: rgba(255, 255, 255, 0.86);
      --bg-glass-strong: rgba(255, 255, 255, 0.94);
      --bg-card: #FFFFFF;
      --text-primary: #1D1D1F;
      --text-secondary: #515154;
      --text-muted: #86868B;
      --border-light: rgba(0, 0, 0, 0.08);
      --border-subtle: rgba(0, 0, 0, 0.05);
      --apple-blue: #0071E3;
      --apple-blue-soft: rgba(0, 113, 227, 0.11);
      --apple-green: #1D8348;
      --apple-amber: #D97706;
      --apple-teal: #0891B2;
      --apple-purple: #6D28D9;
      --apple-olive: #4D7C0F;
      --shadow-sm: 0 2px 10px rgba(0, 0, 0, 0.05);
      --shadow-md: 0 8px 28px rgba(15, 23, 42, 0.09);
      --shadow-lg: 0 16px 42px rgba(15, 23, 42, 0.13);
      --radius-pill: 999px;
      --radius-lg: 20px;
      --radius-md: 14px;
    }


    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }


    html, body {
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      background: var(--bg-app);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Heebo', sans-serif;
      -webkit-font-smoothing: antialiased;
      user-select: none;
    }


    /* Fullscreen Map Viewport */
    #map-stage {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100dvh;
      z-index: 1;
      background: #E9F1F6;
      touch-action: none;
    }


    #topo-canvas {
      width: 100%;
      height: 100%;
      display: block;
      cursor: grab;
    }
    #topo-canvas:active {
      cursor: grabbing;
    }


    /* Top Floating Apple Glass Bar (KISS) */
    .top-chrome {
      position: fixed;
      top: max(10px, env(safe-area-inset-top));
      left: 12px;
      right: 12px;
      z-index: 30;
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: none;
    }


    .nav-bar {
      pointer-events: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      background: var(--bg-glass);
      backdrop-filter: blur(24px) saturate(190%);
      -webkit-backdrop-filter: blur(24px) saturate(190%);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-pill);
      padding: 6px 10px;
      box-shadow: var(--shadow-md);
      max-width: 980px;
      margin: 0 auto;
      width: 100%;
    }


    .brand-cluster {
      display: flex;
      align-items: center;
      gap: 8px;
      padding-right: 4px;
      flex-shrink: 0;
    }


    .brand-dot {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: linear-gradient(135deg, #0071E3, #00A2FF);
      color: #fff;
      font-weight: 800;
      font-size: 11px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 8px rgba(0, 113, 227, 0.3);
      letter-spacing: -0.3px;
    }


    .brand-title {
      font-size: 14px;
      font-weight: 800;
      color: var(--text-primary);
      letter-spacing: -0.2px;
      white-space: nowrap;
    }
    .brand-sub {
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 500;
      display: none;
    }
    @media (min-width: 640px) {
      .brand-sub { display: inline; margin-right: 4px; }
    }


    /* Apple Segmented Control */
    .segmented-control {
      display: flex;
      align-items: center;
      background: rgba(118, 118, 128, 0.12);
      border-radius: var(--radius-pill);
      padding: 3px;
      gap: 2px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .segmented-control::-webkit-scrollbar { display: none; }


    .seg-btn {
      border: none;
      background: transparent;
      color: var(--text-secondary);
      font-family: inherit;
      font-size: 12.5px;
      font-weight: 600;
      padding: 5px 12px;
      border-radius: var(--radius-pill);
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s cubic-bezier(0.25, 1, 0.5, 1);
    }


    .seg-btn.active {
      background: #FFFFFF;
      color: var(--text-primary);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
    }


    .action-cluster {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }


    .pill-action {
      border: 1px solid var(--border-light);
      background: #FFFFFF;
      color: var(--text-primary);
      font-family: inherit;
      font-size: 12px;
      font-weight: 700;
      padding: 6px 12px;
      border-radius: var(--radius-pill);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      box-shadow: var(--shadow-sm);
      transition: transform 0.15s ease, background 0.15s ease;
      white-space: nowrap;
    }
    .pill-action:active { transform: scale(0.96); }
    .pill-action.primary {
      background: var(--apple-blue);
      color: #FFFFFF;
      border-color: transparent;
      box-shadow: 0 3px 10px rgba(0, 113, 227, 0.28);
    }
    .pill-action.whatsapp {
      background: #E8F8EE;
      color: #127839;
      border-color: rgba(18, 120, 57, 0.18);
    }


    /* Filter Chips Row */
    .filter-strip {
      pointer-events: auto;
      display: flex;
      align-items: center;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
      max-width: 980px;
      margin: 0 auto;
      width: 100%;
      padding: 2px 2px;
    }
    .filter-strip::-webkit-scrollbar { display: none; }


    .chip {
      border: 1px solid var(--border-light);
      background: var(--bg-glass);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      color: var(--text-secondary);
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      padding: 5px 12px;
      border-radius: var(--radius-pill);
      cursor: pointer;
      white-space: nowrap;
      box-shadow: var(--shadow-sm);
      transition: all 0.18s ease;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .chip.active {
      background: var(--text-primary);
      color: #FFFFFF;
      border-color: var(--text-primary);
    }
    .chip-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      display: inline-block;
    }


    /* Floating Map Controls (Right Side, Apple Maps style) */
    .map-controls {
      position: fixed;
      left: 12px;
      top: 50%;
      transform: translateY(-55%);
      z-index: 25;
      display: flex;
      flex-direction: column;
      gap: 6px;
      background: var(--bg-glass);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border-light);
      border-radius: 14px;
      padding: 5px;
      box-shadow: var(--shadow-md);
    }


    .ctrl-btn {
      width: 36px;
      height: 36px;
      border: none;
      background: transparent;
      color: var(--text-primary);
      font-size: 16px;
      font-weight: 700;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s;
    }
    .ctrl-btn:hover { background: rgba(0, 0, 0, 0.05); }
    .ctrl-btn.active-toggle {
      background: var(--apple-blue-soft);
      color: var(--apple-blue);
    }
    .ctrl-divider {
      height: 1px;
      background: var(--border-light);
      margin: 1px 4px;
    }


    /* Sean Guided Tour Floating Card */
    #sean-banner {
      position: fixed;
      top: 108px;
      left: 12px;
      right: 12px;
      max-width: 620px;
      margin: 0 auto;
      z-index: 35;
      background: var(--bg-glass-strong);
      backdrop-filter: blur(26px);
      -webkit-backdrop-filter: blur(26px);
      border: 1px solid rgba(0, 113, 227, 0.25);
      border-radius: var(--radius-lg);
      padding: 14px 16px;
      box-shadow: var(--shadow-lg);
      display: none;
      animation: slideDown 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .sean-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
    }
    .sean-badge {
      font-size: 11px;
      font-weight: 800;
      color: var(--apple-blue);
      background: var(--apple-blue-soft);
      padding: 3px 9px;
      border-radius: var(--radius-pill);
    }
    .sean-title {
      font-size: 14px;
      font-weight: 800;
      color: var(--text-primary);
      margin-bottom: 4px;
    }
    .sean-desc {
      font-size: 12.5px;
      line-height: 1.5;
      color: var(--text-secondary);
      margin-bottom: 10px;
    }
    .sean-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }


    /* Bottom Apple Maps Sheet (KISS) */
    .bottom-sheet {
      position: fixed;
      bottom: max(10px, env(safe-area-inset-bottom));
      left: 12px;
      right: 12px;
      max-width: 980px;
      margin: 0 auto;
      z-index: 30;
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: none;
    }


    /* Search & Carousel Bar */
    .carousel-tray {
      pointer-events: auto;
      background: var(--bg-glass);
      backdrop-filter: blur(24px) saturate(190%);
      -webkit-backdrop-filter: blur(24px) saturate(190%);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-lg);
      padding: 10px 12px;
      box-shadow: var(--shadow-md);
      transition: all 0.25s ease;
    }


    .tray-top {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }


    .search-box {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(118, 118, 128, 0.1);
      border-radius: 10px;
      padding: 6px 10px;
    }
    .search-box input {
      border: none;
      background: transparent;
      width: 100%;
      font-family: inherit;
      font-size: 13px;
      color: var(--text-primary);
      outline: none;
    }
    .search-box input::placeholder { color: var(--text-muted); }


    .count-label {
      font-size: 11.5px;
      font-weight: 700;
      color: var(--text-secondary);
      white-space: nowrap;
      padding: 0 4px;
    }


    .farm-cards-row {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
      padding-bottom: 2px;
    }
    .farm-cards-row::-webkit-scrollbar { display: none; }


    .mini-card {
      flex: 0 0 215px;
      background: #FFFFFF;
      border: 1px solid var(--border-light);
      border-radius: 12px;
      padding: 8px 10px;
      cursor: pointer;
      transition: all 0.18s ease;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 4px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.03);
    }
    .mini-card:hover, .mini-card.selected {
      border-color: var(--apple-blue);
      box-shadow: 0 4px 14px rgba(0, 113, 227, 0.16);
      transform: translateY(-1px);
    }
    .mc-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 4px;
    }
    .mc-cat {
      font-size: 10px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 6px;
      background: #F2F2F7;
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .mc-elev {
      font-size: 10px;
      font-weight: 700;
      color: #6E6E73;
      direction: ltr;
    }
    .mc-title {
      font-size: 12.5px;
      font-weight: 700;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .mc-sub {
      font-size: 11px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }


    /* Selected Farm Inspector Card (Apple Maps Place Card) */
    #place-card {
      pointer-events: auto;
      background: var(--bg-glass-strong);
      backdrop-filter: blur(28px) saturate(200%);
      -webkit-backdrop-filter: blur(28px) saturate(200%);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-lg);
      padding: 14px 16px;
      box-shadow: var(--shadow-lg);
      display: none;
      animation: slideUp 0.22s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }


    .pc-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 8px;
    }
    .pc-badges {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 4px;
    }
    .pc-badge {
      font-size: 11px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: var(--radius-pill);
      background: var(--apple-blue-soft);
      color: var(--apple-blue);
    }
    .pc-badge.topo {
      background: #EFECE6;
      color: #5C5346;
    }
    .pc-title {
      font-size: 16px;
      font-weight: 800;
      color: var(--text-primary);
      line-height: 1.25;
    }
    .pc-close {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: none;
      background: rgba(118, 118, 128, 0.14);
      color: var(--text-secondary);
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      flex-shrink: 0;
    }
    .pc-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 6px;
      margin-bottom: 10px;
      font-size: 12.5px;
      color: var(--text-secondary);
      background: #F5F5F7;
      padding: 10px 12px;
      border-radius: 12px;
    }
    @media (min-width: 640px) {
      .pc-grid { grid-template-columns: 1fr 1fr; }
    }
    .pc-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .pc-btn {
      flex: 1;
      min-width: 110px;
      text-decoration: none;
      text-align: center;
      padding: 8px 12px;
      border-radius: 11px;
      font-size: 12.5px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: transform 0.15s ease;
    }
    .pc-btn:active { transform: scale(0.97); }
    .pc-btn.waze { background: #0099FF; color: #FFFFFF; }
    .pc-btn.gmaps { background: #1D8348; color: #FFFFFF; }
    .pc-btn.source { background: #E5E5EA; color: var(--text-primary); }


    /* Fullscreen Clean Apple Sheet for 100 OSINT & 100 CRM */
    #data-modal {
      position: fixed;
      inset: 0;
      z-index: 28;
      background: var(--bg-app);
      padding: 110px 16px 24px;
      overflow-y: auto;
      display: none;
    }
    .data-container {
      max-width: 980px;
      margin: 0 auto;
    }
    .data-toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 14px;
      background: #FFFFFF;
      padding: 12px 16px;
      border-radius: 16px;
      border: 1px solid var(--border-light);
      box-shadow: var(--shadow-sm);
    }
    .data-search {
      flex: 1;
      min-width: 220px;
      border: 1px solid var(--border-light);
      background: #F5F5F7;
      padding: 8px 12px;
      border-radius: 10px;
      font-family: inherit;
      font-size: 13.5px;
      outline: none;
    }
    .data-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
      gap: 10px;
    }
    .apple-card {
      background: #FFFFFF;
      border: 1px solid var(--border-light);
      border-radius: 14px;
      padding: 14px;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 8px;
    }
    .ac-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }
    .ac-num {
      font-size: 11px;
      font-weight: 800;
      color: var(--apple-blue);
      background: var(--apple-blue-soft);
      padding: 2px 8px;
      border-radius: var(--radius-pill);
    }
    .ac-cat {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
    }
    .ac-title {
      font-size: 14px;
      font-weight: 800;
      color: var(--text-primary);
    }
    .ac-desc {
      font-size: 12.5px;
      color: var(--text-secondary);
      line-height: 1.45;
    }
    .ac-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 6px;
      border-top: 1px solid var(--border-subtle);
      font-size: 12px;
    }
    .ac-link {
      color: var(--apple-blue);
      text-decoration: none;
      font-weight: 700;
    }
  </style>
</head>
<body>


  <!-- Topographic Interactive Canvas -->
  <div id="map-stage">
    <canvas id="topo-canvas"></canvas>
  </div>


  <!-- Top Apple Floating Header (KISS) -->
  <div class="top-chrome">
    <div class="nav-bar">
      <div class="brand-cluster">
        <div class="brand-dot">E27</div>
        <div>
          <span class="brand-title">ESH27 · מפת החוות</span>
          <span class="brand-sub">טופוגרפיה ומודיעין ביצועי</span>
        </div>
      </div>


      <div class="segmented-control">
        <button class="seg-btn active" id="tab-map" onclick="switchView('map')">🗺️ מפה (130+)</button>
        <button class="seg-btn" id="tab-osint" onclick="switchView('osint')">📡 100 OSINT</button>
        <button class="seg-btn" id="tab-crm" onclick="switchView('crm')">🤝 100 אנשי קשר</button>
      </div>


      <div class="action-cluster">
        <button class="pill-action primary" id="btn-sean" onclick="toggleSeanTour()">▶️ מצגת לשון</button>
        <button class="pill-action whatsapp" onclick="shareWhatsApp()">📲 שתף</button>
      </div>
    </div>


    <!-- Clean Category Filter Pills (Only visible on Map) -->
    <div class="filter-strip" id="map-filters">
      <button class="chip active" onclick="setFilter('all', this)">הכל (58 מוקדים / 130+ חוות)</button>
      <button class="chip" onclick="setFilter('anchor', this)"><span class="chip-dot" style="background:#0071E3"></span>עוגן ESH27 וחרשה</button>
      <button class="chip" onclick="setFilter('harasha', this)"><span class="chip-dot" style="background:#1D8348"></span>רדיוס 15 ק״מ מחרשה</button>
      <button class="chip" onclick="setFilter('tourism', this)"><span class="chip-dot" style="background:#D97706"></span>תיירות, יקבים וקפה</button>
      <button class="chip" onclick="setFilter('binyamin', this)"><span class="chip-dot" style="background:#0891B2"></span>בנימין</button>
      <button class="chip" onclick="setFilter('shomron', this)"><span class="chip-dot" style="background:#6D28D9"></span>שומרון וגב ההר</button>
      <button class="chip" onclick="setFilter('valley', this)"><span class="chip-dot" style="background:#4D7C0F"></span>בקעת הירדן</button>
      <button class="chip" onclick="setFilter('judea', this)"><span class="chip-dot" style="background:#B45309"></span>גוש עציון והר חברון</button>
    </div>
  </div>


  <!-- Left Floating Topographic Controls -->
  <div class="map-controls" id="map-side-controls">
    <button class="ctrl-btn" title="התקרב" onclick="zoomBy(1.28)">＋</button>
    <div class="ctrl-divider"></div>

      { name: "90", pts: [[31.45,35.39],[31.62,35.43],[31.78,35.48],[31.95,35.47],[32.10,35.50],[32.25,35.53],[32.39,35.55]], color: "#EAB308" },

    function distKm(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }


    FARMS.forEach(f => {
      f.distHarasha = Math.round(distKm(HARASHA.lat, HARASHA.lon, f.lat, f.lon));
    });


    const canvas = document.getElementById('topo-canvas');
    const ctx = canvas.getContext('2d');
    let width = window.innerWidth;
    let height = window.innerHeight;
    let dpr = Math.min(window.devicePixelRatio || 1, 2);


    let cam = { lat: 31.92, lon: 35.22, scale: 1.25 };
    let activeFilter = 'all';
    let selectedFarm = FARMS[0];
    let showContours = true;
    let showRings = true;
    let topoMode = 'hybrid'; // 'hybrid' (Esri World Topo + Vector Contours), 'vector' (Pure Apple Vector Topo), 'opentopo' (OpenTopoMap)
    let currentView = 'map';
    let seanIdx = -1;
    const tileCache = {};


    function getTileUrl(mode, z, x, y) {
      if (mode === 'opentopo') {
        return `https://tile.opentopomap.org/${z}/${x}/${y}.png`;
      }
      return `https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/${z}/${y}/${x}`;
    }


    function lon2tile(lon, z) { return (lon + 180) / 360 * Math.pow(2, z); }
    function lat2tile(lat, z) {
      const rad = lat * Math.PI / 180;
      return (1 - Math.log(Math.tan(rad) + 1 / Math.cos(rad)) / Math.PI) / 2 * Math.pow(2, z);
    }
    function tile2lon(x, z) { return x / Math.pow(2, z) * 360 - 180; }
    function tile2lat(y, z) {
      const n = Math.PI - 2 * Math.PI * y / Math.pow(2, z);
      return 180 / Math.PI * Math.atan(0.5 * (Math.exp(n) - Math.exp(-n)));
    }


    function drawLiveTopoTiles() {
      if (topoMode === 'vector') return;
      const z = Math.max(8, Math.min(13, Math.round(8.6 + Math.log2(cam.scale))));
      const topLeft = unproject(0, 0);
      const botRight = unproject(width, height);
      const minX = Math.max(0, Math.floor(lon2tile(topLeft.lon, z)));
      const maxX = Math.min(Math.pow(2, z) - 1, Math.floor(lon2tile(botRight.lon, z)));
      const minY = Math.max(0, Math.floor(lat2tile(topLeft.lat, z)));
      const maxY = Math.min(Math.pow(2, z) - 1, Math.floor(lat2tile(botRight.lat, z)));


      if ((maxX - minX) > 12 || (maxY - minY) > 12) return;


      ctx.save();
      ctx.globalAlpha = topoMode === 'opentopo' ? 0.78 : 0.88;
      for (let tx = minX; tx <= maxX; tx++) {
        for (let ty = minY; ty <= maxY; ty++) {
          const key = `${topoMode}_${z}_${tx}_${ty}`;
          let img = tileCache[key];
          if (!img) {
            img = new Image();
            img.crossOrigin = 'anonymous';
            img.onload = () => { img.ready = true; requestAnimationFrame(drawMap); };
            img.onerror = () => { img.failed = true; };
            img.src = getTileUrl(topoMode, z, tx, ty);
            tileCache[key] = img;
          }
          if (img.ready) {
            const nw = project(tile2lat(ty, z), tile2lon(tx, z));
            const se = project(tile2lat(ty + 1, z), tile2lon(tx + 1, z));
            ctx.drawImage(img, nw.x, nw.y, se.x - nw.x + 0.8, se.y - nw.y + 0.8);
          }
        }
      }
      ctx.restore();
    }


    function cycleTopoMode() {
      const modes = ['hybrid', 'opentopo', 'vector'];
      topoMode = modes[(modes.indexOf(topoMode) + 1) % modes.length];
      document.getElementById('btn-map-mode').classList.toggle('active-toggle', topoMode !== 'vector');
      drawMap();
    }


    function resize() {
      width = window.innerWidth;
      height = window.innerHeight;
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = width * dpr;
      canvas.height = height * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      drawMap();
    }
    window.addEventListener('resize', resize);


    function project(lat, lon) {
      const baseScale = Math.min(width, height) * 0.78 * cam.scale;
      const cosLat = Math.cos(31.95 * Math.PI / 180);
      const x = width * 0.5 + (lon - cam.lon) * cosLat * baseScale;
      const y = height * 0.46 - (lat - cam.lat) * baseScale;
      return { x, y };
    }


    function unproject(x, y) {
      const baseScale = Math.min(width, height) * 0.78 * cam.scale;
      const cosLat = Math.cos(31.95 * Math.PI / 180);
      const lon = cam.lon + (x - width * 0.5) / (cosLat * baseScale);
      const lat = cam.lat - (y - height * 0.46) / baseScale;
      return { lat, lon };
    }


    function getCategoryColor(f) {
      if (f.tags.includes('anchor')) return '#0071E3';
      if (f.tags.includes('tourism')) return '#D97706';
      if (f.tags.includes('binyamin')) return '#0891B2';
      if (f.tags.includes('shomron')) return '#6D28D9';
      if (f.tags.includes('valley')) return '#4D7C0F';
      if (f.tags.includes('judea')) return '#B45309';
      return '#1D8348';
    }


    function matchesFilter(f) {
      if (activeFilter === 'all') return true;
      if (activeFilter === 'harasha') return f.distHarasha <= 16 || f.tags.includes('anchor');
      return f.tags.includes(activeFilter);
    }


    function drawMap() {
      ctx.clearRect(0, 0, width, height);


      // 1. Bright Sunlit Apple Maps Terrain Base
      const bgGrad = ctx.createLinearGradient(0, 0, width, height);
      bgGrad.addColorStop(0, '#EBF3E8');   // Coastal lush lowland
      bgGrad.addColorStop(0.48, '#F6F3EB'); // Warm limestone central ridge
      bgGrad.addColorStop(0.78, '#EFE6D5'); // Judean desert slopes
      bgGrad.addColorStop(1, '#E6EFE4');    // Jordan valley floor
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, width, height);


      // 2. Mediterranean Sea (West) & Dead Sea + Jordan River (East)
      ctx.save();
      const coastPts = [[32.6,34.89],[32.3,34.84],[32.08,34.76],[31.80,34.63],[31.50,34.50],[31.20,34.35],[31.20,33.8],[32.6,33.8]];
      ctx.beginPath();
      coastPts.forEach((pt, i) => {
        const p = project(pt[0], pt[1]);
        if (i === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y);
      });
      ctx.closePath();
      ctx.fillStyle = '#CBE6F6';
      ctx.fill();
      ctx.strokeStyle = '#9BC8E6';
      ctx.lineWidth = 1.5;
      ctx.stroke();


      // Dead Sea
      const deadSeaPts = [[31.76,35.48],[31.76,35.57],[31.45,35.56],[31.15,35.48],[31.15,35.39],[31.45,35.40],[31.62,35.45]];
      ctx.beginPath();
      deadSeaPts.forEach((pt, i) => {
        const p = project(pt[0], pt[1]);
        if (i === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y);
      });
      ctx.closePath();
      ctx.fillStyle = '#B7DDF2';
      ctx.fill();
      ctx.strokeStyle = '#8CC2E3';
      ctx.lineWidth = 1.4;
      ctx.stroke();


      // Jordan River line
      const jordanPts = [[32.55,35.57],[32.30,35.56],[32.10,35.54],[31.90,35.51],[31.76,35.50]];
      ctx.beginPath();
      jordanPts.forEach((pt, i) => {
        const p = project(pt[0], pt[1]);
        if (i === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y);
      });
      ctx.strokeStyle = '#8CC2E3';
      ctx.lineWidth = 2.2;
      ctx.stroke();
      ctx.restore();


      drawLiveTopoTiles();


      // 3. Topographic Hypsometric Ridge Shading & Contour Lines (קווי גובה טופוגרפיים)
      if (showContours) {
        ctx.save();
        // Central Mountain Spine (גב ההר) soft relief glow
        TOPO_PEAKS.forEach(pk => {
          const center = project(pk.lat, pk.lon);
          const edge = project(pk.lat + pk.ry, pk.lon + pk.rx);
          const rx = Math.abs(edge.x - center.x);
          const ry = Math.abs(edge.y - center.y);
          const maxR = Math.max(rx, ry, 18);


          const grad = ctx.createRadialGradient(center.x - maxR*0.12, center.y - maxR*0.12, maxR*0.05, center.x, center.y, maxR);
          grad.addColorStop(0, 'rgba(214, 190, 152, 0.34)');
          grad.addColorStop(0.55, 'rgba(225, 208, 178, 0.18)');
          grad.addColorStop(1, 'rgba(244, 241, 234, 0)');
          ctx.fillStyle = grad;
          ctx.beginPath();
          ctx.ellipse(center.x, center.y, rx, ry, -0.18, 0, Math.PI * 2);
          ctx.fill();


          // Concentric topographic contour rings (5 levels per massif)
          const levels = [0.95, 0.76, 0.58, 0.40, 0.23];
          levels.forEach((lvl, idx) => {
            ctx.beginPath();
            ctx.ellipse(center.x, center.y, rx * lvl, ry * lvl, -0.18, 0, Math.PI * 2);
            ctx.strokeStyle = idx % 2 === 0 ? 'rgba(161, 136, 102, 0.32)' : 'rgba(161, 136, 102, 0.18)';
            ctx.lineWidth = idx === 2 ? 1.2 : 0.75;
            ctx.stroke();
          });


          // Peak triangle & elevation label
          if (cam.scale >= 0.85) {
            ctx.fillStyle = '#7C6546';
            ctx.font = '600 10px -apple-system, Heebo, sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(`▲ ${pk.name} (${pk.elev}m)`, center.x, center.y - 6);
          }
        });


        // Wadis / Stream Valleys
        WADIS.forEach(w => {
          ctx.beginPath();
          w.pts.forEach((pt, i) => {
            const p = project(pt[0], pt[1]);
            if (i === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y);
          });
          ctx.strokeStyle = 'rgba(116, 180, 218, 0.55)';
          ctx.lineWidth = 1.5;
          ctx.setLineDash([4, 3]);
          ctx.stroke();
          ctx.setLineDash([]);
        });
        ctx.restore();
      }


      // 4. Harasha Base Operational Radius Rings (10km, 25km, 45km)
      if (showRings) {
        const hp = project(HARASHA.lat, HARASHA.lon);
        [10, 25, 45].forEach(km => {
          const edge = project(HARASHA.lat + (km / 111.32), HARASHA.lon);
          const rPx = Math.abs(hp.y - edge.y);
          ctx.save();
          ctx.beginPath();
          ctx.arc(hp.x, hp.y, rPx, 0, Math.PI * 2);
          ctx.strokeStyle = km === 10 ? 'rgba(0, 113, 227, 0.35)' : 'rgba(0, 113, 227, 0.18)';
          ctx.lineWidth = km === 10 ? 1.6 : 1.1;
          ctx.setLineDash([6, 5]);
          ctx.stroke();
          ctx.setLineDash([]);


          ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
          ctx.strokeStyle = 'rgba(0, 113, 227, 0.25)';
          const tagW = 84, tagH = 18;
          ctx.beginPath();
          ctx.roundRect(hp.x - tagW/2, hp.y - rPx - 9, tagW, tagH, 9);
          ctx.fill();
          ctx.stroke();


          ctx.fillStyle = '#0071E3';
          ctx.font = '700 10px -apple-system, Heebo, sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText(`רדיוס ${km} ק״מ מחרשה`, hp.x, hp.y - rPx + 3.5);
          ctx.restore();
        });
      }


      // 5. Apple Maps-Style Highways (Cased Ribbons + Route Shields)
      HIGHWAYS.forEach(hw => {
        ctx.save();
        ctx.beginPath();
        hw.pts.forEach((pt, i) => {
          const p = project(pt[0], pt[1]);
          if (i === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y);
        });
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        // Outer white casing
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.9)';
        ctx.lineWidth = 4.5;
        ctx.stroke();
        // Inner route color
        ctx.strokeStyle = hw.color;
        ctx.lineWidth = 2.4;
        ctx.globalAlpha = 0.72;
        ctx.stroke();
        ctx.globalAlpha = 1;


        // Highway shield badge at midpoint
        const mid = hw.pts[Math.floor(hw.pts.length / 2)];
        const mp = project(mid[0], mid[1]);
        ctx.fillStyle = '#FFFFFF';
        ctx.strokeStyle = hw.color;
        ctx.lineWidth = 1.4;
        ctx.beginPath();
        ctx.roundRect(mp.x - 13, mp.y - 8, 26, 16, 5);
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = '#1D1D1F';
        ctx.font = '800 9.5px -apple-system, Heebo, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(hw.name, mp.x, mp.y + 3.5);
        ctx.restore();
      });


      // 6. Reference Cities
      CITIES.forEach(c => {
        const p = project(c.lat, c.lon);
        ctx.save();
        ctx.fillStyle = c.major ? '#1D1D1F' : '#6E6E73';
        ctx.font = c.major ? '700 11.5px -apple-system, Heebo, sans-serif' : '600 10.5px -apple-system, Heebo, sans-serif';
        ctx.textAlign = 'center';
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.92)';
        ctx.lineWidth = 3;
        ctx.strokeText(c.name, p.x, p.y + 14);
        ctx.fillText(c.name, p.x, p.y + 14);
        ctx.restore();
      });


      // 7. Farm Pins & Smart Apple Pill Labels (No Overlap)
      const placedLabels = [];
      const visibleFarms = FARMS.filter(matchesFilter);


      visibleFarms.forEach(f => {
        const p = project(f.lat, f.lon);
        if (p.x < -40 || p.x > width + 40 || p.y < -40 || p.y > height + 40) return;


        const isSel = selectedFarm && selectedFarm.id === f.id;
        const isAnchor = f.tags.includes('anchor');
        const col = getCategoryColor(f);


        ctx.save();
        // Selection halo
        if (isSel || isAnchor) {
          ctx.beginPath();
          ctx.arc(p.x, p.y, isSel ? 17 : 13, 0, Math.PI * 2);
          ctx.fillStyle = isSel ? 'rgba(0, 113, 227, 0.22)' : 'rgba(0, 113, 227, 0.14)';
          ctx.fill();
        }


        // Apple Maps Pin Circle with White Rim & Drop Shadow
        const r = isSel ? 8.5 : (isAnchor ? 7.5 : 6);
        ctx.shadowColor = 'rgba(0, 0, 0, 0.22)';
        ctx.shadowBlur = 6;
        ctx.shadowOffsetY = 2;
        ctx.beginPath();
        ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
        ctx.fillStyle = col;
        ctx.fill();
        ctx.shadowColor = 'transparent';
        ctx.lineWidth = 2.2;
        ctx.strokeStyle = '#FFFFFF';
        ctx.stroke();


        // Smart Collision-Free Pill Label
        const cleanName = f.name.split('–')[0].split('(')[0].trim();
        const labelText = cam.scale >= 1.5 ? `${cleanName} · ${f.elev > 0 ? '+'+f.elev : f.elev}m` : cleanName;
        ctx.font = (isSel || isAnchor) ? '700 11.5px -apple-system, Heebo, sans-serif' : '600 10.5px -apple-system, Heebo, sans-serif';
        const tw = ctx.measureText(labelText).width + 12;
        const th = 19;
        const lx = p.x - tw / 2;
        const ly = p.y - r - th - 4;


        let collides = false;
        if (!isSel && !isAnchor) {
          for (const b of placedLabels) {
            if (lx < b.x + b.w + 4 && lx + tw + 4 > b.x && ly < b.y + b.h + 2 && ly + th + 2 > b.y) {
              collides = true;
              break;
            }
          }
        }


        if (!collides || isSel || isAnchor) {
          placedLabels.push({ x: lx, y: ly, w: tw, h: th });
          ctx.fillStyle = isSel ? '#1D1D1F' : 'rgba(255, 255, 255, 0.92)';
          ctx.strokeStyle = isSel ? '#1D1D1F' : 'rgba(0, 0, 0, 0.1)';
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.roundRect(lx, ly, tw, th, 9);
          ctx.fill();
          ctx.stroke();


          ctx.fillStyle = isSel ? '#FFFFFF' : '#1D1D1F';
          ctx.textAlign = 'center';
          ctx.fillText(labelText, p.x, ly + 13);
        }
        ctx.restore();
      });
    }


    // Touch & Mouse Gestures (Pan, Pinch-to-Zoom, Tap Pin)
    let isDragging = false;
    let dragStart = { x: 0, y: 0 };
    let camStart = { lat: 0, lon: 0 };
    let pinchDist0 = 0;
    let scale0 = 1;


    function handleTap(x, y) {
      let closest = null;
      let minDist = 28;
      FARMS.filter(matchesFilter).forEach(f => {
        const p = project(f.lat, f.lon);
        const d = Math.hypot(p.x - x, p.y - y);
        if (d < minDist) {
          minDist = d;
          closest = f;
        }
      });
      if (closest) {
        selectFarm(closest, true);
      }
    }


    canvas.addEventListener('mousedown', e => {
      isDragging = true;
      dragStart = { x: e.clientX, y: e.clientY };
      camStart = { lat: cam.lat, lon: cam.lon };
    });


    window.addEventListener('mousemove', e => {
      if (!isDragging) return;
      const dx = e.clientX - dragStart.x;
      const dy = e.clientY - dragStart.y;
      const baseScale = Math.min(width, height) * 0.78 * cam.scale;
      const cosLat = Math.cos(31.95 * Math.PI / 180);
      cam.lon = camStart.lon - dx / (cosLat * baseScale);
      cam.lat = camStart.lat + dy / baseScale;
      drawMap();
    });


    window.addEventListener('mouseup', e => {
      if (!isDragging) return;
      isDragging = false;
      if (Math.hypot(e.clientX - dragStart.x, e.clientY - dragStart.y) < 6) {
        handleTap(e.clientX, e.clientY);
      }
    });


    canvas.addEventListener('wheel', e => {
      e.preventDefault();
      const factor = e.deltaY < 0 ? 1.14 : 0.88;
      cam.scale = Math.max(0.55, Math.min(8, cam.scale * factor));
      drawMap();
    }, { passive: false });


    canvas.addEventListener('touchstart', e => {
      if (e.touches.length === 1) {
        isDragging = true;
        dragStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
        camStart = { lat: cam.lat, lon: cam.lon };
      } else if (e.touches.length === 2) {
        isDragging = false;
        pinchDist0 = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        scale0 = cam.scale;
      }
    }, { passive: true });


    canvas.addEventListener('touchmove', e => {
      if (e.touches.length === 1 && isDragging) {
        const dx = e.touches[0].clientX - dragStart.x;
        const dy = e.touches[0].clientY - dragStart.y;
        const baseScale = Math.min(width, height) * 0.78 * cam.scale;
        const cosLat = Math.cos(31.95 * Math.PI / 180);
        cam.lon = camStart.lon - dx / (cosLat * baseScale);
        cam.lat = camStart.lat + dy / baseScale;
        drawMap();
      } else if (e.touches.length === 2 && pinchDist0 > 0) {
        const dist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        cam.scale = Math.max(0.55, Math.min(8, scale0 * (dist / pinchDist0)));
        drawMap();
      }
    }, { passive: true });


    canvas.addEventListener('touchend', e => {
      if (e.changedTouches.length === 1 && isDragging) {
        const t = e.changedTouches[0];
        if (Math.hypot(t.clientX - dragStart.x, t.clientY - dragStart.y) < 8) {
          handleTap(t.clientX, t.clientY);
        }
      }
      isDragging = false;
    });


    function animateCamera(targetLat, targetLon, targetScale) {
      const sLat = cam.lat, sLon = cam.lon, sScale = cam.scale;
      const t0 = performance.now();
      const dur = 420;
      function step(now) {
        const p = Math.min(1, (now - t0) / dur);
        const ease = 1 - Math.pow(1 - p, 3);
        cam.lat = sLat + (targetLat - sLat) * ease;
        cam.lon = sLon + (targetLon - sLon) * ease;
        cam.scale = sScale + (targetScale - sScale) * ease;
        drawMap();
        if (p < 1) requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    }


    function zoomBy(factor) {
      animateCamera(cam.lat, cam.lon, Math.max(0.55, Math.min(8, cam.scale * factor)));
    }


    function toggleContours() {
      showContours = !showContours;
      document.getElementById('btn-contours').classList.toggle('active-toggle', showContours);
      drawMap();
    }


    function toggleRings() {
      showRings = !showRings;
      document.getElementById('btn-rings').classList.toggle('active-toggle', showRings);
      drawMap();
    }


    function focusHarasha() {
      selectFarm(FARMS[0], true);
      animateCamera(HARASHA.lat, HARASHA.lon, 2.8);
    }


    function setFilter(tag, btnEl) {
      activeFilter = tag;
      document.querySelectorAll('#map-filters .chip').forEach(b => b.classList.remove('active'));
      if (btnEl) btnEl.classList.add('active');
      renderFarmCarousel();
      drawMap();
    }


    function selectFarm(f, openCard = true) {
      selectedFarm = f;
      drawMap();
      renderFarmCarousel();
      if (openCard) {
        document.getElementById('pc-cat').textContent = `${f.region} · ${f.cat}`;
        const elevStr = f.elev > 0 ? `+${f.elev}m` : `${f.elev}m`;
        document.getElementById('pc-elev').textContent = `⛰️ גובה טופוגרפי: ${elevStr}`;
        document.getElementById('pc-dist').textContent = `📍 ${f.distHarasha} ק״מ מחרשה`;
        document.getElementById('pc-title').textContent = f.name;
        document.getElementById('pc-owners').textContent = f.owners;
        document.getElementById('pc-opp').textContent = f.opp;
        document.getElementById('pc-waze').href = `https://waze.com/ul?ll=${f.lat},${f.lon}&navigate=yes`;
        document.getElementById('pc-gmaps').href = `https://www.google.com/maps/search/?api=1&query=${f.lat},${f.lon}`;
        document.getElementById('pc-source').href = f.url || 'https://docs.google.com/spreadsheets/d/1V5Vja7y6kSDdbnosWbQR6tHxItICeR5rK07MI8OGptk/edit';
        // Render West-to-East Topographic Cross-Section SVG
        const normX = Math.max(8, Math.min(232, ((f.lon - 34.60) / (35.56 - 34.60)) * 224 + 8));
        const normY = Math.max(4, Math.min(30, 26 - ((f.elev + 400) / 1450) * 22));
        document.getElementById('pc-topo-svg').innerHTML = `
          <defs>
            <linearGradient id="topoFill" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#D4B88C" stop-opacity="0.65"/>
              <stop offset="100%" stop-color="#EBF3E8" stop-opacity="0.2"/>
            </linearGradient>
          </defs>
          <path d="M 4 25 Q 45 23, 85 12 T 145 5 Q 185 8, 210 26 L 236 30 L 236 33 L 4 33 Z" fill="url(#topoFill)" stroke="#9C825B" stroke-width="1.4"/>
          <line x1="${normX}" y1="2" x2="${normX}" y2="32" stroke="#0071E3" stroke-width="1.2" stroke-dasharray="2,2"/>
          <circle cx="${normX}" cy="${normY}" r="4.2" fill="#0071E3" stroke="#FFFFFF" stroke-width="1.6"/>
          <text x="6" y="32" font-size="7.5" fill="#6E6E73">הים (0m)</text>
          <text x="115" y="13" font-size="7.5" fill="#5C5346" text-anchor="middle">גב ההר (+1016m)</text>
          <text x="234" y="24" font-size="7.5" fill="#6E6E73" text-anchor="end">הבקעה (-350m)</text>
        `;
        document.getElementById('place-card').style.display = 'block';
      }
    }


    function closePlaceCard() {
      document.getElementById('place-card').style.display = 'none';
    }


    function renderFarmCarousel() {
      const q = (document.getElementById('map-search').value || '').trim().toLowerCase();
      const row = document.getElementById('farm-carousel');
      const filtered = FARMS.filter(f => {
        if (!matchesFilter(f)) return false;
        if (!q) return true;
        return f.name.toLowerCase().includes(q) || f.region.toLowerCase().includes(q) || f.owners.toLowerCase().includes(q) || f.opp.toLowerCase().includes(q);
      });
      document.getElementById('visible-count').textContent = `${filtered.length} מוקדים`;


      row.innerHTML = filtered.map(f => {
        const isSel = selectedFarm && selectedFarm.id === f.id;
        const elevStr = f.elev > 0 ? `+${f.elev}m` : `${f.elev}m`;
        return `
          <div class="mini-card ${isSel ? 'selected' : ''}" onclick="focusOnFarm(${f.id})">
            <div class="mc-top">
              <span class="mc-cat">${f.region}</span>
              <span class="mc-elev">⛰️ ${elevStr}</span>
            </div>
            <div class="mc-title">${f.name}</div>
            <div class="mc-sub">
              <span>מרחק מחרשה: ${f.distHarasha} ק״מ</span>
              <span style="color:var(--apple-blue);font-weight:700;">פרטים ←</span>
            </div>
          </div>
        `;
      }).join('');
    }


    function focusOnFarm(id) {
      const f = FARMS.find(x => x.id === id);
      if (!f) return;
      selectFarm(f, true);
      animateCamera(f.lat, f.lon, Math.max(cam.scale, 2.3));
    }


    // Guided 5-Step Presentation for Sean
    function toggleSeanTour() {
      const banner = document.getElementById('sean-banner');
      if (banner.style.display === 'block') {
        closeSeanTour();
      } else {
        switchView('map');
        seanIdx = 0;
        banner.style.display = 'block';
        applySeanStep();
      }
    }


    function closeSeanTour() {
      document.getElementById('sean-banner').style.display = 'none';
      seanIdx = -1;
    }


    function applySeanStep() {
      const s = SEAN_STEPS[seanIdx];
      document.getElementById('sean-step-badge').textContent = `מצגת לשון · שלב ${seanIdx + 1} מתוך ${SEAN_STEPS.length}`;
      document.getElementById('sean-step-title').textContent = s.title;
      document.getElementById('sean-step-desc').textContent = s.desc;
      const f = FARMS.find(x => x.id === s.farmId);
      if (f) selectFarm(f, true);
      animateCamera(s.lat, s.lon, s.scale);
    }


    function nextSeanStep() {
      seanIdx = (seanIdx + 1) % SEAN_STEPS.length;
      applySeanStep();
    }


    function prevSeanStep() {
      seanIdx = (seanIdx - 1 + SEAN_STEPS.length) % SEAN_STEPS.length;
      applySeanStep();
    }


    // View Switcher (Map / 100 OSINT / 100 CRM)
    function switchView(view) {
      currentView = view;
      document.getElementById('tab-map').classList.toggle('active', view === 'map');
      document.getElementById('tab-osint').classList.toggle('active', view === 'osint');
      document.getElementById('tab-crm').classList.toggle('active', view === 'crm');


      const isMap = view === 'map';
      document.getElementById('map-filters').style.display = isMap ? 'flex' : 'none';
      document.getElementById('map-side-controls').style.display = isMap ? 'flex' : 'none';
      document.getElementById('map-bottom-sheet').style.display = isMap ? 'flex' : 'none';
      document.getElementById('data-modal').style.display = isMap ? 'none' : 'block';


      if (!isMap) {
        closeSeanTour();
        document.getElementById('dm-search').value = '';
        renderDataCards();
      }
    }


    function renderDataCards() {
      const q = (document.getElementById('dm-search').value || '').trim().toLowerCase();
      const grid = document.getElementById('dm-grid');


      if (currentView === 'osint') {
        document.getElementById('dm-title').textContent = '📡 100 פריטי מודיעין גלוי (OSINT) – חוות יו״ש והבקעה';
        document.getElementById('dm-sub').textContent = 'נתוני קרקעות, תקציבים, מכרזי מועצות, תיירות, סולארי וחקלאות מתוך תיק המודיעין של ESH27';
        const items = INTEL_DB.osint.filter(x => !q || x.title.toLowerCase().includes(q) || x.desc.toLowerCase().includes(q) || x.cat.toLowerCase().includes(q));
        grid.innerHTML = items.map(x => `
          <div class="apple-card">
            <div>
              <div class="ac-top">
                <span class="ac-num">#${x.id}</span>
                <span class="ac-cat">${x.cat}</span>
              </div>
              <div class="ac-title" style="margin:6px 0 4px;">${x.title}</div>
              <div class="ac-desc">${x.desc}</div>
            </div>
            <div class="ac-foot">
              <span style="color:var(--text-muted)">מקור: ${x.src}</span>
              <a class="ac-link" href="${x.url}" target="_blank" rel="noopener">פתיחת מקור ↗</a>
            </div>
          </div>
        `).join('');
      } else if (currentView === 'crm') {
        document.getElementById('dm-title').textContent = '🤝 100 אנשי קשר, בעלי חוות, אדריכלים ומקבלי החלטות (CRM)';
        document.getElementById('dm-sub').textContent = 'רשימת 100 מוקדי הכוח להרחבת המעגל העסקי של אריאל, שון ורועי ל-100 פרויקטים';
        const items = INTEL_DB.crm.filter(x => !q || x.name.toLowerCase().includes(q) || x.role.toLowerCase().includes(q) || x.org.toLowerCase().includes(q) || x.angle.toLowerCase().includes(q));
        grid.innerHTML = items.map(x => `
          <div class="apple-card">
            <div>
              <div class="ac-top">
                <span class="ac-num">איש קשר #${x.id}</span>
                <span class="ac-cat">${x.cat}</span>
              </div>
              <div class="ac-title" style="margin:6px 0 2px;">${x.name}</div>
              <div style="font-size:12px;font-weight:600;color:var(--apple-blue);margin-bottom:6px;">${x.role} · ${x.org}</div>
              <div class="ac-desc"><strong>זווית כניסה ESH27:</strong> ${x.angle}</div>
            </div>
            <div class="ac-foot">
              <span style="font-weight:700;color:var(--text-primary);direction:ltr;">${x.contact}</span>
              <a class="ac-link" href="${x.url}" target="_blank" rel="noopener">אסמכתא / קישור ↗</a>
            </div>
          </div>
        `).join('');
      }
    }


    function shareWhatsApp() {
      const shareUrl = 'https://farms.esh27.com';
      const msg = `שון אחי, הנה מפת השליטה הטופוגרפית של ESH27 לכל 130+ החוות ביו״ש והבקעה (כולל 100 פריטי OSINT ו-100 אנשי קשר מתוך בסיס האם שלנו בעין חרשה): ${shareUrl}`;
      window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`, '_blank');
    }


    // Initialize
    resize();
    renderFarmCarousel();
  </script>
</body>
