name: Deploy esh27-core to Cloud Run (Keyless WIF)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# הרשאות OIDC חובה עבור Workload Identity Federation
permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: esh27-unicorn-core
  REGION: us-central1
  SERVICE_NAME: esh27-sovereign-core
  WIF_PROVIDER: projects/252873823435/locations/global/workloadIdentityPools/github-pool/providers/github-provider
  WIF_SA: github-actions-sa@esh27-unicorn-core.iam.gserviceaccount.com

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud via WIF
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SA }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # Public ingress is intentional (browsers call it); the app itself rejects /v1 calls
      # without a valid X-API-Key. Keys live in Secret Manager, never in the workflow.
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --source . \
            --platform managed \
            --region ${{ env.REGION }} \
            --allow-unauthenticated \
            --port 8080 \
            --set-env-vars "GCP_PROJECT=${{ env.PROJECT_ID }},GCP_REGION=${{ env.REGION }}" \
            --set-secrets "ESH27_API_KEYS=esh27-api-keys:latest" \
            --quiet
